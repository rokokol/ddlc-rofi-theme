name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # update-lock.yml runs this workflow, not a copy of its commands, against the bump
  # branch — without workflow_call + ref that verify step silently checks out master
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31

      - name: VERSION matches CHANGELOG
        run: |
          ver=$(cat VERSION)
          grep -qF "## [$ver]" CHANGELOG.md || {
            echo "VERSION says $ver but CHANGELOG.md has no ## [$ver] heading" >&2
            exit 1
          }

      - run: nix build --no-write-lock-file .#ddlc-rofi-theme
      # tests, installer-suite, dist-is-current, theme-parses, module-wiring, scripts-lint
      - run: nix flake check --no-write-lock-file

      # The full installer contract lives in tests/installer.sh (run by flake check);
      # this is the smoke that the same script behaves on a real filesystem outside the
      # sandbox, switch included
      - name: install.sh works
        run: |
          PREFIX=$PWD/out ./install.sh
          test -f out/share/rofi/themes/ddlc-light.rasi
          test -f out/share/rofi/themes/ddlc-polka-light.svg
          test -f out/share/ddlc-rofi-theme/install-manifest
          HOME=$PWD/fake XDG_CONFIG_HOME=$PWD/fake/.config out/bin/ddlc-rofi-theme dark
          test "$(readlink fake/.config/rofi/themes/ddlc.rasi)" = "$PWD/out/share/rofi/themes/ddlc-dark.rasi"
          PREFIX=$PWD/out ./install.sh --uninstall
          test ! -e out/share/ddlc-rofi-theme
          test ! -e out/bin/ddlc-rofi-theme
          ./install.sh --destdir "$PWD/stage" --prefix /usr
          test -f stage/usr/share/rofi/themes/ddlc-light.rasi
          test -x stage/usr/bin/ddlc-rofi-theme
          # if-form, not `! cmd`: -e ignores negated pipelines, so a `! cmd` line only
          # bites while it happens to be the last one — anyone appending disarms it
          if DESTDIR=$PWD/bad PREFIX=usr ./install.sh >/dev/null 2>&1; then
            echo "a relative PREFIX was accepted" >&2
            exit 1
          fi

      - run: nix fmt -- --ci

  # The one file list lives in the flake's scripts-lint check — this job is a fast,
  # separately-named status for it, not a second copy of the commands
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      # nix run/shell nixpkgs#tool is a mirror-fate lookup — whatever nixpkgs the runner
      # resolves today decides the job. Tools a workflow needs live in the flake's dev
      # shell, pinned by the lock, reached with nix develop
      # Every vendored copy is byte-equal to its source: one edited here instead of at the
      # source fails by name — see .github/vendor.lock
      - name: vendored copies are byte-equal to their source
        run: ./vendor-sync.sh check
      - name: CI tools come from the lock, not the registry
        run: ./check-pins.sh
      - run: nix build --no-write-lock-file .#checks.x86_64-linux.scripts-lint
